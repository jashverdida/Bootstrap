<!DOCTYPE html>
<html lang="en">
<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Login</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
		<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
			<div class="container-fluid">
				<a class="navbar-brand" href="index.html">My Bootstrap Site</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarNav">
					<ul class="navbar-nav ms-auto">
						<li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
						<li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
						<li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
						<li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
					</ul>
				</div>
			</div>
		</nav>
		<div class="container mt-5">
			<div class="row justify-content-center">
				<div class="col-md-6">
					<h2 class="mb-4">Login</h2>
					<form class="needs-validation" novalidate>
						<div class="mb-3">
							<label for="loginEmail" class="form-label">Email address</label>
							<input type="email" class="form-control" id="loginEmail" required>
							<div class="invalid-feedback">Please enter a valid email.</div>
						</div>
						<div class="mb-3">
							<label for="loginPassword" class="form-label">Password</label>
							<input type="password" class="form-control" id="loginPassword" required minlength="6">
							<div class="invalid-feedback">Password must be at least 6 characters.</div>
						</div>
						<div class="mb-3 text-center">
							<small>Don't have an account? <a href="register.html">Sign up</a></small>
						</div>
						<button type="submit" class="btn btn-primary w-100">Login</button>
					</form>
				</div>
			</div>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
		<script>
			// Bootstrap validation and redirect after login
			(() => {
				'use strict';
				const forms = document.querySelectorAll('.needs-validation');
				Array.from(forms).forEach(form => {
					form.addEventListener('submit', event => {
						if (!form.checkValidity()) {
							event.preventDefault();
							event.stopPropagation();
						} else {
							event.preventDefault();
							// Simulate successful login and redirect
							window.location.href = 'dashboard.html';
						}
						form.classList.add('was-validated');
					}, false);
				});
			})();
		</script>
</body>
</html>
