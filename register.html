<!DOCTYPE html>
<html lang="en">
<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Register</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
		<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
			<div class="container-fluid">
				<a class="navbar-brand" href="index.html">My Bootstrap Site</a>
				<div class="collapse navbar-collapse">
					<ul class="navbar-nav ms-auto">
						<li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
						<li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
						<li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
						<li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
					</ul>
				</div>
			</div>
		</nav>
		<div class="container mt-5">
			<div class="row justify-content-center">
				<div class="col-md-6">
					<h2 class="mb-4">Register</h2>
					<form class="needs-validation" novalidate>
						<div class="mb-3">
							<label for="registerEmail" class="form-label">Email address</label>
							<input type="email" class="form-control" id="registerEmail" required>
							<div class="invalid-feedback">Please enter a valid email.</div>
						</div>
						<div class="mb-3">
							<label for="registerPassword" class="form-label">Password</label>
							<input type="password" class="form-control" id="registerPassword" required minlength="6">
							<div class="invalid-feedback">Password must be at least 6 characters.</div>
						</div>
						<div class="mb-3">
							<label for="registerConfirm" class="form-label">Confirm Password</label>
							<input type="password" class="form-control" id="registerConfirm" required minlength="6">
							<div class="invalid-feedback">Passwords must match and be at least 6 characters.</div>
						</div>
						<button type="submit" class="btn btn-success w-100">Register</button>
					</form>
				</div>
			</div>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
		<script>
			// Bootstrap validation and redirect after register
			(() => {
				'use strict';
				const forms = document.querySelectorAll('.needs-validation');
				Array.from(forms).forEach(form => {
					form.addEventListener('submit', event => {
						const password = document.getElementById('registerPassword');
						const confirm = document.getElementById('registerConfirm');
						if (password.value !== confirm.value) {
							confirm.setCustomValidity('Passwords do not match');
						} else {
							confirm.setCustomValidity('');
						}
						if (!form.checkValidity()) {
							event.preventDefault();
							event.stopPropagation();
						} else {
							event.preventDefault();
							// Simulate successful registration and redirect
							window.location.href = 'login.html';
						}
						form.classList.add('was-validated');
					}, false);
				});
			})();
		</script>
</body>
</html>
